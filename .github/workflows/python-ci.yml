name: CI

on:
    push:
        branches: [develop]
        paths:
            - "src/**"
            - "tests/**"
            - pyproject.toml
            - uv.lock
            - "docs/**"
            - "pytest.ini"
            - ".github/workflows/**"
    workflow_run:
        workflows: ["Update Requirements"]
        types: [completed]

jobs:
    tests:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
        concurrency: ci-${{ github.ref }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          name: Linux,
                          python: "3.11",
                          os: ubuntu-latest,
                      }
        steps:
            - uses: actions/checkout@v4
            - name: install-uv
              uses: astral-sh/setup-uv@v5
              with:
                  python-version: ${{ matrix.python }}
                  enable-cache: true
            - name: sync-deps
              run: uv sync --group test --frozen
            - name: tests
              run: uv run pytest -v tests
            - name: coverage-summary
              run: |
                  echo "## Python coverage" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  uv run coverage report -m >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  mkdir -p coverage-pages
                  uv run coverage xml -o coverage-pages/coverage.xml
                  uv run coverage html -d coverage-pages/htmlcov
            - name: upload-coverage-artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report-${{ matrix.name }}
                  path: coverage-pages/
            # Warn-only: continue-on-error means this never blocks the job, only shows
            # as a flagged step.
            - name: coverage-threshold
              continue-on-error: true
              run: uv run coverage report --fail-under=0
            # Written alongside the HTML/XML report so the publish step below carries it
            # to GitHub Pages - avoids committing to the source branch. Published under
            # destination_dir: coverage rather than the root, since the docs job below
            # already publishes to the gh-pages root with no destination_dir of its own -
            # colliding there would wipe one or the other on every run.
            - name: coverage-badge
              continue-on-error: true
              run: |
                  PCT=$(uv run coverage report | grep '^TOTAL' | grep -oE '[0-9]+%' | tr -d '%')
                  COLOR=$(awk -v p="$PCT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
                  printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
                      "$PCT" "$COLOR" > coverage-pages/coverage-badge.json
            - name: publish-coverage
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./coverage-pages
                  destination_dir: coverage

    docs:
        needs: [tests]
        runs-on: ubuntu-latest
        concurrency: docs
        steps:
            - uses: actions/checkout@v4
            - name: install-uv
              uses: astral-sh/setup-uv@v5
              with:
                  python-version: "3.11"
            - name: sync-deps
              run: uv sync --group docs --frozen
            - name: make-docs
              run: cd docs && uv run --group docs make html
            # keep_files: true - without it, this root-level publish (no destination_dir)
            # wipes the whole branch by default, deleting the tests job's coverage/
            # subfolder that ran moments earlier in the same workflow.
            - name: publish-docs
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs/_build/html
                  keep_files: true

    publish:
        needs: [tests]
        runs-on: ubuntu-latest
        concurrency: publish
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: publish
              uses: relekang/python-semantic-release@v7.34.6
              with:
                  additional_options: "--patch"
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  repository_username: __token__
                  repository_password: ${{ secrets.PYPI_TOKEN }}

    notify:
        needs: [publish]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - repo: client
                    - repo: library-web
                    - repo: main-web
                    - repo: shared-web
        steps:
            - uses: juztcode/repo-ditpatch-action@v1
              with:
                  event-type: web-core-published
                  token: ${{ secrets.REPO_ACCESS_TOKEN }}
                  repository: sweetrpg/${{ matrix.repo }}
