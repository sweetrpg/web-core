name: CI

on:
    push:
        branches: [develop]
        paths:
            - "src/**"
            - "tests/**"
            - setup.cfg
            - setup.py
            - tox.ini
            - "requirements/*.txt"
            - "docs/**"
            - "pytest.ini"
            - ".github/workflows/**"
    workflow_run:
        workflows: ["Update Requirements"]
        types: [completed]

jobs:
    tests:
        name: ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
        concurrency: ci-${{ github.ref }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {
                          name: Linux,
                          python: "3.11",
                          os: ubuntu-latest,
                          tox: py311,
                      }
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: ${{ matrix.python }}
            - name: update-pip
              run: |
                  pip install -U wheel
                  pip install -U setuptools
                  python -m pip install -U pip
            - name: get-pip-cache-dir
              id: pip-cache
              run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
            - name: cache-pip
              uses: actions/cache@v4
              with:
                  path: ${{ steps.pip-cache.outputs.dir }}
                  key: pip|${{ runner.os }}|${{ matrix.python }}|${{ hashFiles('setup.py') }}|${{ hashFiles('requirements/*.txt') }}
            - name: install-utils
              run: pip install tox
            - name: tests
              run: tox -e ${{ matrix.tox }}
            - name: coverage-summary
              run: |
                  echo "## Python coverage" >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  tox exec -e ${{ matrix.tox }} -- coverage report -m >> "$GITHUB_STEP_SUMMARY"
                  echo '```' >> "$GITHUB_STEP_SUMMARY"
                  mkdir -p coverage-pages
                  tox exec -e ${{ matrix.tox }} -- coverage xml -o coverage-pages/coverage.xml
                  tox exec -e ${{ matrix.tox }} -- coverage html -d coverage-pages/htmlcov
            - name: upload-coverage-artifact
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-report-${{ matrix.name }}
                  path: coverage-pages/
            # Warn-only: continue-on-error means this never blocks the job, only shows
            # as a flagged step.
            - name: coverage-threshold
              continue-on-error: true
              run: tox exec -e ${{ matrix.tox }} -- coverage report --fail-under=0
            # Written alongside the HTML/XML report so the publish step below carries it
            # to GitHub Pages - avoids committing to the source branch. Published under
            # destination_dir: coverage rather than the root, since the docs job below
            # already publishes to the gh-pages root with no destination_dir of its own -
            # colliding there would wipe one or the other on every run.
            - name: coverage-badge
              continue-on-error: true
              run: |
                  PCT=$(tox exec -e ${{ matrix.tox }} -- coverage report | grep '^TOTAL' | grep -oE '[0-9]+%' | tr -d '%')
                  COLOR=$(awk -v p="$PCT" 'BEGIN { if (p>=80) print "brightgreen"; else if (p>=50) print "yellow"; else print "red" }')
                  printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' \
                      "$PCT" "$COLOR" > coverage-pages/coverage-badge.json
            - name: publish-coverage
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./coverage-pages
                  destination_dir: coverage

    docs:
        needs: [tests]
        runs-on: ubuntu-latest
        concurrency: docs
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: install-deps
              run: pip install -r requirements/docs.txt
            - name: make-docs
              run: cd docs && make html
            # keep_files: true - without it, this root-level publish (no destination_dir)
            # wipes the whole branch by default, deleting the tests job's coverage/
            # subfolder that ran moments earlier in the same workflow.
            - name: publish-docs
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./docs/_build/html
                  keep_files: true

    publish:
        needs: [tests]
        runs-on: ubuntu-latest
        concurrency: publish
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: publish
              uses: relekang/python-semantic-release@v7.34.6
              with:
                  additional_options: "--patch"
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  repository_username: __token__
                  repository_password: ${{ secrets.PYPI_TOKEN }}

    notify:
        needs: [publish]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - repo: client
                    - repo: library-web
                    - repo: main-web
                    - repo: shared-web
        steps:
            - uses: juztcode/repo-ditpatch-action@v1
              with:
                  event-type: web-core-published
                  token: ${{ secrets.REPO_ACCESS_TOKEN }}
                  repository: sweetrpg/${{ matrix.repo }}
